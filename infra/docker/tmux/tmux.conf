
# =============================================================================
# tmux 추천 설정 파일
# 위치: ~/.tmux.conf
# =============================================================================

# UTF-8 locale 강제 설정
set-environment -g LANG C.UTF-8
set-environment -g LC_ALL C.UTF-8

# 외부 환경 변수 상속
set -g update-environment -r

# -----------------------------------------------------------------------------
# 기본 설정
# -----------------------------------------------------------------------------

# 256 컬러 지원
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# 히스토리 크기 증가
set -g history-limit 50000

# 새로고침 간격 단축 (상태바 업데이트)
set -g status-interval 5


# 윈도우와 페인 번호를 1부터 시작
set -g base-index 1
setw -g pane-base-index 1

# 윈도우 삭제 시 자동 번호 재정렬
set -g renumber-windows on

# 마우스 지원 활성화
set -g mouse on

# 클립보드 설정
set -g set-clipboard on

# 포커스 이벤트 활성화
set -g focus-events on

# -----------------------------------------------------------------------------
# 키 바인딩
# -----------------------------------------------------------------------------

# 설정 파일 리로드 단축키
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 더 직관적인 페인 분할
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 새 윈도우/페인을 현재 경로에서 열기
bind c new-window -c "#{pane_current_path}"

# Vim 스타일 페인 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + 방향키로 페인 이동 (prefix 없이)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + 방향키로 페인 크기 조정
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl + 방향키로 세밀한 크기 조정
bind -r C-h resize-pane -L 1
bind -r C-j resize-pane -D 1
bind -r C-k resize-pane -U 1
bind -r C-l resize-pane -R 1

# 페인 최대화 토글
bind m resize-pane -Z

# 윈도우 순서 변경
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# 페인 동기화 토글
bind S setw synchronize-panes \; display-message "Sync: #{?pane_synchronized,ON,OFF}"

# Shift+좌우 화살표로 윈도우 전환
bind -n S-Left previous-window
bind -n S-Right next-window
# -----------------------------------------------------------------------------
# 복사 모드 (Vi 스타일)
# -----------------------------------------------------------------------------

# Vi 모드 사용
setw -g mode-keys vi

# 복사 모드 진입
bind Escape copy-mode

# 복사 모드 키 바인딩
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 시스템 클립보드 연동 (OS별 설정)
# macOS
if-shell "uname | grep -q Darwin" \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

# Linux (xclip 필요)
if-shell "uname | grep -q Linux" \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"'

# WSL
if-shell 'test -n "$WSL_DISTRO_NAME"' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"'

# -----------------------------------------------------------------------------
# 상태바 디자인
# -----------------------------------------------------------------------------

# 상태바 위치
set -g status-position bottom

# 상태바 색상
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# 상태바 좌측
set -g status-left-length 30
set -g status-left '#[fg=#89b4fa,bold] #S #[fg=#cdd6f4]│ '

# 상태바 우측
set -g status-right-length 50
set -g status-right '#[fg=#cdd6f4]│ #[fg=#f9e2af]#{?client_prefix,◆ ,}#[fg=#89dceb]%Y-%m-%d #[fg=#f5c2e7]%H:%M '

# 윈도우 상태
setw -g window-status-format '#[fg=#6c7086] #I:#W#F '
setw -g window-status-current-format '#[fg=#89b4fa,bold,bg=#313244] #I:#W#F '
setw -g window-status-separator ''

# 페인 경계선
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'

# 메시지 스타일
set -g message-style 'fg=#cdd6f4 bg=#313244 bold'

# -----------------------------------------------------------------------------
# 유용한 추가 옵션
# -----------------------------------------------------------------------------

# 벨 알림 설정
set -g bell-action none
set -g visual-bell off

# 윈도우 활동 모니터링
setw -g monitor-activity on
set -g visual-activity off

# 자동 윈도우 이름 설정
setw -g automatic-rename on

# 터미널 타이틀 설정
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# -----------------------------------------------------------------------------
# 플러그인 (TPM 사용 시)
# -----------------------------------------------------------------------------

# TPM 플러그인 목록
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# resurrect 설정 (세션 저장/복원)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# continuum 설정 (자동 저장)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM 초기화 (반드시 맨 마지막 줄에)
run '~/.tmux/plugins/tpm/tpm'

